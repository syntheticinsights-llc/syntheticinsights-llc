<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Password | Smartodo</title>
        <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
        <script src="assets/js/theme.js"></script>
        <link rel="stylesheet" href="assets/css/styles.css" />
        <script src="assets/js/account_text.js"></script>
        <script src="assets/js/i18n.js"></script>
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <div class="branding">
                    <img class="logo-mark" src="assets/img/icon.svg" alt="Smartodo icon" data-i18n-alt="logoAlt" />
                    <span class="logo-type">Smartodo</span>
                </div>
                <div class="site-header__actions">
                    <nav class="site-nav">
                        <a href="index.html#features" data-landing-link="#features" data-i18n="navFeatures">Features</a>
                        <a href="index.html#downloads" data-landing-link="#downloads" data-i18n="navDownloads">Downloads</a>
                        <a href="privacy.html" data-i18n="navPrivacy">Privacy</a>
                    </nav>
                    <button
                        type="button"
                        class="theme-toggle"
                        data-theme-toggle
                        data-i18n-aria-label="themeToggleLabel"
                        data-i18n-title="themeToggleLabel"
                        aria-label="Switch theme"
                        title="Switch theme"
                    >
                        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                        </svg>
                        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <main class="auth-page">
            <div class="container">
                <div class="auth-card">
                    <p class="eyebrow" data-i18n="reset.eyebrow">Reset password</p>
                    <h1 data-i18n="reset.heading">Set a new password</h1>
                    <p class="lead" data-i18n="reset.lead">Update your Smartodo password and sign in again.</p>

                    <div class="field">
                        <label for="password" data-i18n="reset.passwordLabel">New password</label>
                        <input
                            id="password"
                            type="password"
                            placeholder="Enter a new password"
                            data-i18n-placeholder="reset.passwordPlaceholder"
                            autocomplete="new-password"
                        />
                    </div>

                    <div class="field">
                        <label for="confirm" data-i18n="reset.confirmLabel">Confirm new password</label>
                        <input
                            id="confirm"
                            type="password"
                            placeholder="Re-enter the password"
                            data-i18n-placeholder="reset.confirmPlaceholder"
                            autocomplete="new-password"
                        />
                    </div>

                    <div class="form-actions">
                        <button id="submit" class="button primary" type="button" data-i18n="reset.submit">
                            Update password
                        </button>
                    </div>

                    <p class="status" id="status"></p>
                </div>
            </div>
        </main>

        <script type="module">
            import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

            // Project config — keep anon key on frontend
            const SUPABASE_URL = "https://xjsyhejacfndraryyqaq.supabase.co";
            const SUPABASE_ANON_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqc3loZWphY2ZuZHJhcnl5cWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU4MjcxODAsImV4cCI6MjA2MTQwMzE4MH0.xaY6wwxMZqi_zkICjXS4H3IDNwV9z3YGGXIBzve2eEM";

            const text = applyAccountText("reset");
            const statusEl = document.getElementById("status");
            const passwordInput = document.getElementById("password");
            const confirmInput = document.getElementById("confirm");
            const submitBtn = document.getElementById("submit");

            const setStatus = (message, type = "info") => {
                statusEl.textContent = message;
                statusEl.className = `status${type === "info" ? "" : " " + type}`;
            };

            const toggleForm = (enabled) => {
                passwordInput.disabled = !enabled;
                confirmInput.disabled = !enabled;
                submitBtn.disabled = !enabled;
            };

            const cleanUrl = () => {
                const url = `${window.location.origin}${window.location.pathname}`;
                window.history.replaceState({}, document.title, url);
            };

            const getTokenFromQuery = () => new URLSearchParams(window.location.search).get("token");
            const getTokenHashFromQuery = () => new URLSearchParams(window.location.search).get("token_hash");

            // Validate link using token_hash first, then token. This page targets links
            // that include ?token=...&token_hash=... (as in received email).
            const validateRecoveryLink = async (supabase) => {
                const tokenHash = getTokenHashFromQuery();
                const token = getTokenFromQuery();

                if (!token && !tokenHash) {
                    setStatus(text.missingToken, "error");
                    toggleForm(false);
                    return false;
                }

                setStatus(text.verifying);

                // Try token_hash first (preferred), then token (short OTP style)
                try {
                    if (tokenHash) {
                        const { data, error } = await supabase.auth.verifyOtp({
                            type: "recovery",
                            token_hash: tokenHash,
                        });
                        if (error) throw error;
                        if (!data?.session) throw new Error("Verification did not return a session.");
                    } else {
                        const { data, error } = await supabase.auth.verifyOtp({
                            type: "recovery",
                            token: token,
                        });
                        if (error) throw error;
                        if (!data?.session) throw new Error("Verification did not return a session.");
                    }

                    // Remove tokens from URL for privacy
                    cleanUrl();
                    setStatus(text.verified);
                    toggleForm(true);
                    return true;
                } catch (err) {
                    console.error(err);
                    setStatus(text.invalidLink, "error");
                    toggleForm(false);
                    return false;
                }
            };

            const run = async () => {
                const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                toggleForm(false);
                setStatus(text.checking);

                const ok = await validateRecoveryLink(supabase);
                if (!ok) return;

                submitBtn.addEventListener("click", async () => {
                    const password = passwordInput.value.trim();
                    const confirm = confirmInput.value.trim();

                    if (password.length < 8) {
                        setStatus(text.tooShort, "error");
                        return;
                    }
                    if (password !== confirm) {
                        setStatus(text.mismatch, "error");
                        return;
                    }

                    toggleForm(false);
                    submitBtn.textContent = text.submitting;

                    const { error } = await supabase.auth.updateUser({ password });
                    if (error) {
                        console.error(error);
                        setStatus(text.updateFailed, "error");
                        toggleForm(true);
                        submitBtn.textContent = text.submit;
                        return;
                    }

                    setStatus(text.success, "success");
                    submitBtn.textContent = text.submitted;
                });
            };

            run();
        </script>
    </body>
</html>
