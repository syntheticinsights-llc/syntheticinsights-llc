<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Confirm Signup | Smartodo</title>
        <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="assets/css/styles.css" />
        <script src="assets/js/account_text.js"></script>
        <script src="assets/js/i18n.js"></script>
    </head>
    <body>
        <header class="site-header">
            <div class="container">
                <div class="branding">
                    <img
                        class="logo-mark"
                        src="assets/img/icon.svg"
                        alt="Smartodo icon"
                        data-i18n-alt="logoAlt"
                    />
                    <span class="logo-type">Smartodo</span>
                </div>
                <nav class="site-nav">
                    <a href="index.html#features" data-landing-link="#features" data-i18n="navFeatures">Features</a>
                    <a href="index.html#downloads" data-landing-link="#downloads" data-i18n="navDownloads">Downloads</a>
                    <a href="privacy.html" data-i18n="navPrivacy">Privacy</a>
                </nav>
            </div>
        </header>

        <main class="auth-page">
            <div class="container">
                <div class="auth-card">
                    <p class="eyebrow" data-i18n="signup.eyebrow">Confirm email</p>
                    <h1 data-i18n="signup.heading">Verify your account</h1>
                    <p class="lead" data-i18n="signup.lead">
                        We are confirming your email address. This may take a few seconds.
                    </p>

                    <p class="status" id="status"></p>
                </div>
            </div>
        </main>

        <script type="module">
            import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

            const SUPABASE_URL = "https://xjsyhejacfndraryyqaq.supabase.co";
            const SUPABASE_ANON_KEY =
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhqc3loZWphY2ZuZHJhcnl5cWFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU4MjcxODAsImV4cCI6MjA2MTQwMzE4MH0.xaY6wwxMZqi_zkICjXS4H3IDNwV9z3YGGXIBzve2eEM";

            const searchParams = new URLSearchParams(window.location.search);
            const text = applyAccountText("signup");

            const statusEl = document.getElementById("status");

            const setStatus = (message, type = "info") => {
                statusEl.textContent = message;
                statusEl.className = `status${type === "info" ? "" : " " + type}`;
            };

            const cleanUrl = () => {
                const url = `${window.location.origin}${window.location.pathname}`;
                window.history.replaceState({}, document.title, url);
            };

            const getTokenFromQuery = () => searchParams.get("token");
            const getTokenHashFromQuery = () => searchParams.get("token_hash");

            const verifySignup = async (supabase) => {
                const tokenHash = getTokenHashFromQuery();
                const token = getTokenFromQuery();

                if (!token && !tokenHash) {
                    setStatus(text.missingToken, "error");
                    return false;
                }

                setStatus(text.verifying);

                try {
                    if (tokenHash) {
                        const { data, error } = await supabase.auth.verifyOtp({
                            type: "signup",
                            token_hash: tokenHash,
                        });
                        if (error) throw error;
                        if (!data?.session) throw new Error(text.verificationFailed);
                    } else {
                        const { data, error } = await supabase.auth.verifyOtp({
                            type: "signup",
                            token,
                        });
                        if (error) throw error;
                        if (!data?.session) throw new Error(text.verificationFailed);
                    }

                    cleanUrl();
                    setStatus(text.success, "success");
                    return true;
                } catch (err) {
                    console.error(err);
                    setStatus(text.verificationFailed, "error");
                    return false;
                }
            };

            const run = async () => {
                setStatus(text.preparing);
                const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                await verifySignup(supabase);
            };

            run();
        </script>
    </body>
</html>
