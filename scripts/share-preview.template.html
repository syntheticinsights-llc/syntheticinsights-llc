<!doctype html>
<!-- Source for the social share cards. Rendered by scripts/build-share-images.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
      }

      body {
        position: relative;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
        color: #180f2e;
        background:
          radial-gradient(560px 420px at 90% 4%, rgba(153, 85, 255, 0.22), transparent 70%),
          radial-gradient(460px 340px at 2% 100%, rgba(255, 144, 196, 0.16), transparent 72%),
          linear-gradient(140deg, #fdfaff 0%, #f8f0ff 54%, #efe2ff 100%);
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(120, 70, 200, 0.16) 1.5px, transparent 1.5px);
        background-size: 26px 26px;
        -webkit-mask-image: linear-gradient(120deg, rgba(0, 0, 0, 0.6), transparent 62%);
      }

      .content {
        position: absolute;
        inset: 56px 64px 48px;
        display: flex;
        flex-direction: column;
        width: 580px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .brand__mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 22px rgba(119, 51, 221, 0.26);
      }

      .brand__mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .brand__name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .main {
        margin-block: auto;
      }

      .title {
        margin: 0;
        max-width: 580px;
        font-size: 56px;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.022em;
        word-break: auto-phrase;
      }

      .chips {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        gap: 12px;
        margin-top: 28px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 10px 18px;
        border: 1px solid rgba(153, 85, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 6px 16px rgba(84, 40, 150, 0.08);
        color: #4b3a70;
        font-size: 19px;
        font-weight: 600;
        white-space: nowrap;
      }

      .chip__dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(140deg, #bb88ff, #7733dd);
      }

      .site {
        font-size: 17px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #8b79aa;
      }

      .panel {
        position: absolute;
        top: 96px;
        right: 64px;
        width: 470px;
        height: 438px;
        border: 1px solid rgba(153, 85, 255, 0.16);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.66);
        box-shadow:
          0 34px 70px rgba(80, 34, 150, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        -webkit-backdrop-filter: blur(6px);
      }

      .panel__glow {
        position: absolute;
        left: 232px;
        top: 96px;
        width: 220px;
        height: 220px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(153, 85, 255, 0.28), transparent 68%);
        filter: blur(6px);
      }

      .links {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .node {
        position: absolute;
        width: 180px;
        padding: 15px 16px;
        border: 1px solid rgba(153, 85, 255, 0.18);
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 12px 26px rgba(76, 32, 140, 0.11);
      }

      .node--a { left: 26px; top: 44px; }
      .node--b { left: 26px; top: 254px; }
      .node--c { left: 272px; top: 148px; }

      .node--c {
        border-color: rgba(153, 85, 255, 0.34);
        box-shadow: 0 18px 38px rgba(119, 51, 221, 0.2);
      }

      .node__head {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .node__check {
        flex: none;
        width: 18px;
        height: 18px;
        border: 2px solid #cbb9e8;
        border-radius: 999px;
      }

      .node__check--done {
        display: flex;
        align-items: center;
        justify-content: center;
        border-color: transparent;
        background: linear-gradient(140deg, #aa77ff, #7733dd);
        color: #ffffff;
        font-size: 11px;
        font-weight: 800;
      }

      .node__bars {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 2px;
      }

      .node__bar {
        height: 8px;
        border-radius: 999px;
        background: #3d2b5b;
      }

      .node__bar--short {
        height: 7px;
        background: #dccfef;
      }

      .node--a .node__bar,
      .node--a .node__bar--short {
        background: #d8cbed;
      }

      .node__level {
        position: absolute;
        right: 14px;
        top: 13px;
        padding: 3px 9px;
        border-radius: 999px;
        background: #f0e4ff;
        color: #6b3fb8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .node--c .node__level {
        background: #e6d3ff;
        color: #5a2ca8;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>

    <div class="content">
      <div class="brand">
        <span class="brand__mark">__ICON__</span>
        <span class="brand__name">Smartodo</span>
      </div>

      <div class="main">
        <h1 class="title">__TITLE__</h1>
        <div class="chips">__CHIPS__</div>
      </div>

      <div class="site">syntheticinsights.net</div>
    </div>

    <div class="panel">
      <div class="panel__glow"></div>
      <svg class="links" viewBox="0 0 470 438" aria-hidden="true">
        <defs>
          <marker
            id="arrow"
            markerWidth="9"
            markerHeight="9"
            refX="7"
            refY="4.5"
            orient="auto"
          >
            <path d="M0 0 L9 4.5 L0 9 z" fill="#b49ad8" />
          </marker>
        </defs>
        <path
          d="M206 85 C 252 85, 226 189, 272 189"
          fill="none"
          stroke="#b49ad8"
          stroke-width="2.5"
          marker-end="url(#arrow)"
        />
        <path
          d="M206 295 C 252 295, 226 189, 272 189"
          fill="none"
          stroke="#b49ad8"
          stroke-width="2.5"
          marker-end="url(#arrow)"
        />
      </svg>

      <div class="node node--a">
        <div class="node__head">
          <span class="node__check node__check--done">✓</span>
          <span class="node__bars">
            <span class="node__bar" style="width: 84px"></span>
            <span class="node__bar node__bar--short" style="width: 54px"></span>
          </span>
        </div>
        <span class="node__level">L1</span>
      </div>

      <div class="node node--b">
        <div class="node__head">
          <span class="node__check"></span>
          <span class="node__bars">
            <span class="node__bar" style="width: 92px"></span>
            <span class="node__bar node__bar--short" style="width: 66px"></span>
          </span>
        </div>
        <span class="node__level">L1</span>
      </div>

      <div class="node node--c">
        <div class="node__head">
          <span class="node__check"></span>
          <span class="node__bars">
            <span class="node__bar" style="width: 88px"></span>
            <span class="node__bar node__bar--short" style="width: 60px"></span>
          </span>
        </div>
        <span class="node__level">L2</span>
      </div>
    </div>

    <script>
      const title = document.querySelector('.title');
      let size = 56;
      while (title.offsetHeight > 3.4 * size && size > 36) {
        size -= 1;
        title.style.fontSize = `${size}px`;
      }
    </script>
  </body>
</html>
